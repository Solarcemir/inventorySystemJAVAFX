# ===========================================
# Supabase PostgreSQL Connection Configuration
# ===========================================
# Copy these properties into your backend's application.properties
# Replace the placeholder values with your actual Supabase credentials

spring.application.name=backend

# Supabase Database Connection
# Find these values in: Supabase Dashboard > Settings > Database > Connection string > JDBC
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST:db.YOUR_PROJECT_REF.supabase.co}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:your-supabase-db-password}

# Connection Pool Settings (recommended for cloud DB)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080
