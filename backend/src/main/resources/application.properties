spring.application.name=backend

# ── Database connection ───────────────────────────────────────────────────────
# Real values are NOT stored in git. They come from config/application.properties
# next to the working directory (see config/application.properties.example) or
# from the DB_URL, DB_USERNAME and DB_PASSWORD environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Connection pool (Supabase free tier has connection limits)
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
# Keep connections alive so Supabase doesn't drop idle ones
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA/Hibernate — the app never alters the database schema on its own
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Multipart upload — allow images up to 20 MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB

# Login session — lasts a full work day, cookie only sent by the app itself
server.servlet.session.timeout=12h
server.servlet.session.cookie.same-site=strict

# Fields without @JsonView stay visible when a role-based view is active
spring.jackson.mapper.default-view-inclusion=true

# Server
server.port=8080
